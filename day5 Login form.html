<!DOCTYPE html>
<html>
    <head>
        <title> Agoda.com</title>
        <style>
            body{
                margin:0;

            }
            .main{
                background:linear-gradient(to left,dodgerblue,grey);
                width: 100vw;
                height: 100vh;
                position: relative;

            }
            .one{
               
                width: 35vw;
                height: 80vh;
                background-color: white;
                position: absolute; 
                left: 5vw;
                top: 10vh;

            }

            .one img{
                width: 100%;
                height: 100%;
            }
            
            .two{
                width: 35vw;
                height: 60vh;
                background-color:rgb(255, 255, 255);
                position: absolute; 
                right: 20vw;
                top: 20vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 30px;
                
            }

            .two form{
                display:flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .two input{
                width: 20vw;
                height: 5vh;
            }
            input{
                font-size: x-large;
                color: black;
            }
            button{
                width: 10vw;
                height: 40px;
                background-color: dodgerblue;
                font-size: large;
            }
            ::placeholder{
                font-size: larger;
                color: rgb(110, 108, 108);
                padding-left: 30px;
            }
            h1{
                font-size: 40px;
            }
            .three{
                right: 0px;
                width: 18vw;
                height: 100vh;
                background-color: brown;
                position: absolute;

            }



        </style>
    </head>
    <body>
        <div class="main" >
            <div class="one">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSo2xLrxsyG_R2MB5DuDyR9jez33w6ijwomjA&s">

            </div>
            <div class="two">
                <h1>Login Form</h1>
                <input type="text" placeholder="Enter name">
                <br>
                <input type="text" placeholder="Enter email">
                <br>
                <input type="number" placeholder="Enter number ">
                <br>
                <button>Sign in</button>
                
            </div>
            <div class="three">
            <img src="https://www.agoda.com/press/wp-content/uploads/2025/05/Agoda-Joins-Forces-with-Indian-Hotels-Company-Limited-IHCL-To-Expand-Access-to-Indias-Iconic-Hospitality-Portfolio.jpg">
        </div>

        </div>

        
    </body>
</html>
